<div class="login-page">

  <div class="login-card">

    <div class="login-brand">
      <span class="pizza">Pizza</span>
      <span class="calabria">Calabria</span>
    </div>

    <span class="login-eyebrow">ESPACE PRIVÉ</span>

    <h1>Administration</h1>

    <p class="login-description">
      Connectez-vous pour gérer la carte de votre restaurant.
    </p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

      <div class="form-group">
        <label for="username">Identifiant</label>
        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Votre identifiant"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>

        <div class="password-field">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            name="password"
            [(ngModel)]="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            (click)="showPassword.set(!showPassword())"
          >
            {{ showPassword() ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      <p *ngIf="errorMessage()" class="error-message" role="alert">
        {{ errorMessage() }}
      </p>

      <button
        type="submit"
        class="login-submit"
        [disabled]="loginForm.invalid || loading()"
      >
        {{ loading() ? 'Connexion en cours...' : 'Se connecter' }}
      </button>

    </form>

    <div class="login-footer">
      Accès réservé au personnel autorisé
    </div>

  </div>

</div>
